[package]
name = "rtop"
version = "0.1.0"
edition = "2024"
description = "Monitor de sistema interactivo para la terminal, similar a htop, escrito en Rust"
license = "MIT"
repository = "https://github.com/TU_USUARIO/rtop"
homepage = "https://github.com/TU_USUARIO/rtop"
documentation = "https://github.com/TU_USUARIO/rtop#readme"
readme = "README.md"
keywords = ["system-monitor", "htop", "terminal", "tui", "linux", "sysinfo"]
categories = ["command-line-utilities", "system-tools"]
authors = ["Tu Nombre <tu@email.com>"]

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
sysinfo = "0.39.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]